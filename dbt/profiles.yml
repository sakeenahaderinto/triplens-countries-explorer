triplens:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRIPLENS_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'TRIPLENS') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRIPLENS_WH') }}"
      schema: ANALYTICS  
      threads: 4
      client_session_keep_alive: False